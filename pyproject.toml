[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masterthesis-plant-disease-kd"
version = "0.1.0"
description = "Knowledge distillation experiments for plant leaf disease diagnosis."
readme = "docs/DATASETS.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "MasterThesis" }
]
dependencies = [
  "timm",
  "pandas",
  "numpy",
  "scikit-learn",
  "Pillow",
  "tqdm",
  "matplotlib",
  "mlflow",
  "torchinfo",
  "streamlit",
  "psutil"
]

[project.optional-dependencies]
torch-cpu = [
  "torch",
  "torchvision"
]
dev = [
  "ruff",
  "pytest"
]

[project.scripts]
train-baseline = "src.training.train_baseline:main"
train-teacher = "src.training.train_teacher:main"
train-kd = "src.training.train_kd:main"
train-multi-kd = "src.training.train_multi_kd:main"
experiment-queue = "app.queue_worker:main"
analyze-datasets = "src.datasets.analyze_datasets:main"
create-splits = "src.datasets.create_splits:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "app", "app.*"]

[tool.setuptools.package-data]
"src.models._micronet" = ["LICENSE"]
"app" = ["pages/*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
